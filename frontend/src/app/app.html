<header class="app-header">
  <a class="app-header__brand" [routerLink]="brandLink()">Trip Planner</a>
  <nav class="app-header__nav">
    <a
      class="app-header__link"
      routerLink="/home"
      routerLinkActive="app-header__link--active"
      ariaCurrentWhenActive="page">
      Home
    </a>
    <a
      class="app-header__link"
      routerLink="/chat"
      routerLinkActive="app-header__link--active"
      ariaCurrentWhenActive="page">
      AI Assistant
    </a>

    @if (auth.isAuthenticated()) {
      <span class="app-header__user">{{ auth.displayName() }}</span>
      <button class="app-header__signout" type="button" (click)="signOut()">Sign out</button>
    } @else {
      <a
        class="app-header__link app-header__link--auth"
        routerLink="/login"
        routerLinkActive="app-header__link--active"
        ariaCurrentWhenActive="page">
        Sign in
      </a>
      <a class="app-header__cta" routerLink="/register" routerLinkActive="app-header__cta--active">
        Create account
      </a>
    }
  </nav>
</header>

<main class="app-main">
  <router-outlet />
</main>
